# Setup
title: Peihan Li
tagline: Software Engineer | AI & Backend Focus
description: 专业的技术博客和项目展示
url: https://AndyLi429.github.io
avatar: /avatar.jpeg
paginate: 10
paginate_path: /blog/page/:num/
permalink: pretty
cover_image: /bg.jpeg

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec

# Optimize Jekyl SEO Tag
twitter:
  username: AndyLi429
  card: summary
logo: logo.png
social:
  name: Peihan Li
  links:
    - https://github.com/AndyLi429
google_site_verification: xxxxx
lang: en
github_username: AndyLi429
markdown: kramdown

sass:
  sass_dir: _sass
  style: :compressed

# Color scheme
color-scheme: light

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: Peihan Li
  url: https://github.com/AndyLi429/
  email: lipeihan1994@gmail.com
